[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-atm-short-straddle"
version = "0.1.0"
description = "BTC ATM Short Straddle trading system using NautilusTrader and Bybit Testnet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader>=1.231.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

